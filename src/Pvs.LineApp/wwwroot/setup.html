<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Model &amp; Lot Setup — PVS</title>
<style>
  :root{
    --bg:#0C110F;--pan:#141C18;--pan2:#1B251F;--pan3:#243128;--ln:#293A31;--ln2:#37493E;
    --ink:#EAF1EC;--mut:#8EA398;--mut2:#6E8377;--acc:#E3A63C;--acc2:#F0B95A;
    --ok:#54BD7F;--red:#E36B60;--sh1:0 1px 2px rgba(0,0,0,.35);--sh2:0 6px 22px rgba(0,0,0,.40);--rad:14px}
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,Calibri,Arial,sans-serif;font-feature-settings:"tnum" 1;
    background:radial-gradient(1200px 600px at 78% -8%,#16201A 0%,rgba(22,32,26,0) 60%),
               radial-gradient(900px 500px at 0% 100%,#111A15 0%,rgba(17,26,21,0) 55%),var(--bg)}
  b{font-weight:700}
  header{position:sticky;top:0;z-index:40;padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    background:linear-gradient(180deg,rgba(12,17,15,.92),rgba(12,17,15,.72));backdrop-filter:blur(10px);
    border-bottom:1px solid var(--ln);box-shadow:var(--sh1)}
  .brand{display:flex;align-items:baseline;gap:10px;min-width:0}
  .brand .dot{align-self:center;width:11px;height:11px;border-radius:50%;background:var(--acc);flex:none;
    box-shadow:0 0 0 4px rgba(227,166,60,.16),0 0 12px rgba(227,166,60,.55)}
  header h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .sub{font-size:12px;color:var(--mut);white-space:nowrap}
  #model{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;font-size:13.5px;font-weight:600;
    color:var(--ink);background:var(--pan2);border:1px solid var(--ln2);white-space:nowrap;box-shadow:var(--sh1)}
  #model::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .nav{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  a.mon{color:var(--mut);text-decoration:none;font-size:13px;font-weight:600;padding:7px 12px;border-radius:9px;border:1px solid transparent;transition:.15s;white-space:nowrap}
  a.mon:hover{color:var(--ink);background:var(--pan2);border-color:var(--ln)}
  a.mon.back{color:var(--acc2);border-color:var(--ln2)}
  main{padding:22px;max-width:820px;margin:0 auto;display:grid;gap:16px}
  .card{position:relative;background:linear-gradient(180deg,var(--pan),#121A16);border:1px solid var(--ln);border-radius:var(--rad);padding:18px 20px;box-shadow:var(--sh2)}
  .card::before{content:"";position:absolute;inset:0 0 auto;height:1px;border-radius:var(--rad) var(--rad) 0 0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);pointer-events:none}
  h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin:0 0 14px;font-weight:700}
  .seclbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut2);font-weight:700}
  select,input,button{font:15px inherit}
  select,input{background:var(--pan2);border:1px solid var(--ln2);color:var(--ink);border-radius:10px;padding:10px 12px;transition:.15s}
  select:hover{border-color:var(--mut2)}
  select:focus,input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(227,166,60,.16)}
  button{background:var(--pan2);border:1px solid var(--ln2);color:var(--ink);border-radius:10px;padding:10px 15px;cursor:pointer;font-weight:600;transition:transform .1s,border-color .15s,background .15s,filter .15s}
  button:hover{border-color:var(--acc);background:var(--pan3)}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  button.pri{background:linear-gradient(180deg,var(--acc2),var(--acc));border-color:var(--acc2);color:#231703;font-weight:700;box-shadow:0 2px 10px rgba(227,166,60,.28)}
  button.pri:hover{filter:brightness(1.06)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .muted{color:var(--mut);font-size:13px}
  #autoModel{line-height:1.5}
  #lotSel{width:100%;padding:11px 12px;font-size:16px;font-weight:700;border-radius:10px;border:1px solid var(--ln2);background:var(--pan2);color:var(--ink)}
  #lotSelMsg{margin-top:8px;min-height:14px;font-size:12.5px;color:var(--mut)}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span><h1>Model &amp; Lot Setup</h1><span class="sub">Supervisor</span></div>
  <span id="model">no model selected</span>
  <nav class="nav">
    <a class="mon back" href="/verify.html">← Verify / Scan</a>
    <a class="mon" href="/machine-inv.html">Machine inv →</a>
    <a class="mon" href="/reel.html">Reel qty →</a>
    <a class="mon" href="/">Monitor →</a>
  </nav>
</header>

<main>
  <div class="card">
    <h2>Model</h2>
    <div id="autoModel" class="muted" style="margin-bottom:14px;font-size:15px">Detecting running model…</div>
    <div class="row">
      <span class="seclbl">Supervisor set</span>
      <select id="modelSel"><option value="">Select model…</option></select>
      <select id="sideSel"><option value="A">A Side</option><option value="B">B Side</option></select>
      <button class="pri" onclick="selectModel()" title="Supervisor pins the running model (badge required); PVS verifies it against the machine">Set model</button>
      <button id="autoBtn" onclick="returnToAuto()" title="Release the pin — follow the machine automatically" style="display:none">↩ Auto</button>
      <button onclick="reloadDb()" title="Re-pull models and this model's feeder list from the parts-control PC">↻ Refresh from DB</button>
      <span class="muted" id="modelMsg"></span>
    </div>
  </div>

  <div class="card" id="lotSelCard">
    <h2>🎯 Running lot</h2>
    <select id="lotSel" onchange="selectLot()"></select>
    <div class="row" style="margin-top:12px;gap:6px">
      <span class="seclbl">Boards done</span>
      <input id="lotProduced" type="number" min="0" placeholder="produced boards" inputmode="numeric" style="width:150px">
      <button onclick="setProduced()" title="Supervisor sets the boards already produced for this lot/side (e.g. 300 = side complete)">Set produced</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button onclick="forceEndLot()" title="Supervisor force-ends the running lot: finalises its production count and clears it so the next lot can start">⛔ Force-end lot</button>
    </div>
    <div id="lotSelMsg"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let _state = {mode:'None'};
async function api(path, body){ const r = await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})}); return r.json(); }

async function loadModels(){
  const m = await (await fetch('/api/models')).json();
  const sel = $('modelSel');
  m.forEach(p => sel.insertAdjacentHTML('beforeend', `<option value="${p.productId}">${p.name}</option>`));
  if(!m.length) $('modelMsg').textContent = 'No models — DB not connected yet.';
}
// Supervisor pins the running model. Badge-gated (L2+); PVS verifies against the machine once online.
async function selectModel(){
  const id=$('modelSel').value; if(!id) return;
  const side=$('sideSel').value; const name=$('modelSel').selectedOptions[0].text;
  const badge=prompt('SUPERVISOR: scan your badge to set the running model to\n'+name+' · '+side+' side');
  if(!badge||!badge.trim()){ $('modelMsg').textContent='Cancelled — model unchanged.'; return; }
  $('modelMsg').textContent='…';
  const res=await api('/api/model/manual',{productId:+id,side,badge:badge.trim()});
  $('modelMsg').textContent=res.message; pollModel();
}
async function returnToAuto(){
  const badge=prompt('SUPERVISOR: scan your badge to return the line to AUTO model detection');
  if(!badge||!badge.trim()) return;
  $('modelMsg').textContent='…';
  const res=await api('/api/model/auto',{badge:badge.trim()});
  $('modelMsg').textContent=res.message; pollModel();
}
// Supervisor force-ends the running lot (finalises the count, clears it for the next lot). Badge-gated (L2+).
async function forceEndLot(){
  const badge=prompt('SUPERVISOR: scan your badge to FORCE-END the running lot.\nThis finalises its production count and clears it for the next lot.');
  if(!badge||!badge.trim()) return;
  $('lotSelMsg').textContent='…';
  const res=await api('/api/lot/end',{badge:badge.trim()});
  $('lotSelMsg').textContent=res.message;
}
async function reloadDb(){
  if(_state.mode && _state.mode!=='None'){ $('modelMsg').textContent='Finish or cancel the current task before refreshing.'; return; }
  const keepId=$('modelSel').value, keepSide=$('sideSel').value;
  $('modelSel').innerHTML='<option value="">Select model…</option>';
  await loadModels();
  if(keepId){ $('modelSel').value=keepId; const res=await api('/api/model',{productId:+keepId,side:keepSide}); $('modelMsg').textContent='↻ '+res.message; }
  else { $('modelMsg').textContent='↻ Model list refreshed from DB.'; }
}
async function pollModel(){
  try{ _state = await (await fetch('/api/session')).json(); }catch(e){}
  try{
    const cm = await (await fetch('/api/currentmodel')).json();
    if(cm.model){
      $('model').textContent = cm.model+' · '+cm.side+' side'+(cm.auto?' · auto':(cm.manual?' · set':''));
      if(cm.manual){
        const v=cm.verify,d=cm.verifyDetail||'';
        const tag=v==='verified'?'✅ machine verified':v==='mismatch'?'⛔ MACHINE MISMATCH':'⏳ unverified (waiting for machine)';
        const col=v==='verified'?'var(--ok)':v==='mismatch'?'var(--red)':'var(--mut)';
        $('autoModel').innerHTML='⚙ Supervisor-set: <b>'+cm.model+' · '+cm.side+' side</b> — <b style="color:'+col+'">'+tag+'</b>'+(d?(' <span class="muted">('+d+')</span>'):'');
      } else {
        $('autoModel').innerHTML='🔵 Auto-detected (follows the machine): <b>'+cm.model+' · '+cm.side+' side</b>';
      }
      $('autoBtn').style.display = cm.manual ? '' : 'none';
      const af=document.activeElement;
      if(af!==$('modelSel') && af!==$('sideSel')){ if(cm.productId) $('modelSel').value=cm.productId; $('sideSel').value=cm.side; }
    } else { $('autoModel').textContent='No running model detected yet — set it below.'; $('autoBtn').style.display='none'; }
  }catch(e){}
}
// ---- lot selection ----
let lotOptsSig='';
async function loadLotOptions(){
  if(document.activeElement && (document.activeElement.id==='lotSel'||document.activeElement.id==='lotProduced')) return;
  try{
    const d=await (await fetch('/api/lot/options')).json();
    const sel=$('lotSel');
    let opts=(d.options||[]).slice();
    if(d.selected && !opts.some(o=>o.lotNo===d.selected)) opts.unshift({lotNo:d.selected,target:null,deliveryDate:null});
    const sig=(d.selected||'')+'|'+opts.map(o=>o.lotNo+':'+o.target+':'+(o.deliveryDate||'')).join(',');
    if(sig!==lotOptsSig){ lotOptsSig=sig; sel.innerHTML=opts.map(o=>`<option value="${o.lotNo}">${o.lotNo}${o.target!=null?(' — '+o.target+' pcs'):''}${o.deliveryDate?(' · '+o.deliveryDate):''}</option>`).join(''); }
    if(d.selected) sel.value=d.selected;
    $('lotSelMsg').textContent = d.manual ? 'manual pick' : 'auto (current running lot)';
  }catch(e){}
}
async function selectLot(){
  const lot=$('lotSel').value;
  const badge=prompt('SUPERVISOR: scan your badge to change the running lot to\n'+lot);
  if(!badge||!badge.trim()){ lotOptsSig=''; loadLotOptions(); return; }
  $('lotSelMsg').textContent='…';
  try{ const r=await api('/api/lot/select',{lotNo:lot,badge:badge.trim()}); $('lotSelMsg').textContent=r.message||''; }catch(e){}
  lotOptsSig=''; loadLotOptions();
}
// Supervisor sets the boards already produced for the current lot/side (e.g. 300 = side complete).
async function setProduced(){
  const n=parseInt($('lotProduced').value||'');
  if(isNaN(n)||n<0){ $('lotSelMsg').textContent='Enter the boards produced (e.g. 300).'; $('lotProduced').focus(); return; }
  const lot=$('lotSel').value;
  if(!lot){ $('lotSelMsg').textContent='No running lot to set.'; return; }
  const badge=prompt('SUPERVISOR: scan your badge to set produced = '+n+' boards for the current side of lot\n'+lot);
  if(!badge||!badge.trim()) return;
  $('lotSelMsg').textContent='…';
  try{ const r=await api('/api/lot/select',{lotNo:lot,badge:badge.trim(),produced:n}); $('lotSelMsg').textContent=r.message||''; }catch(e){}
  $('lotProduced').value=''; lotOptsSig=''; loadLotOptions();
}
loadModels(); pollModel(); loadLotOptions();
setInterval(()=>{ pollModel(); loadLotOptions(); }, 3000);
</script>
</body>
</html>
