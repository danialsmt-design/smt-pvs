<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Machine Serial Console</title>
<style>
  :root{--bg:#0F1512;--pan:#16201B;--pan2:#1D2A23;--ln:#2A3B31;--ink:#E8EFEA;--mut:#8AA096;--acc:#D9962A;--ok:#4FB477;--red:#D9635A}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",Calibri,Arial,sans-serif}
  header{padding:14px 22px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  a.lnk{color:var(--mut);text-decoration:none;font-size:14px}
  header .sp{margin-left:auto}
  main{padding:18px 22px;max-width:900px;display:grid;gap:16px}
  .card{background:var(--pan);border:1px solid var(--ln);border-radius:12px;padding:16px 18px}
  .mtabs{display:flex;gap:8px;flex-wrap:wrap}
  .mtab{background:var(--pan2);border:1px solid var(--ln);color:var(--mut);border-radius:8px;padding:9px 18px;cursor:pointer;font-weight:600}
  .mtab.active{border-color:var(--acc);color:var(--ink);background:var(--pan)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
  input[type=text]{flex:1;min-width:240px;background:#0C120F;border:1px solid var(--ln);color:var(--ink);border-radius:8px;padding:11px 13px;font:15px Consolas,monospace}
  select{background:#0C120F;border:1px solid var(--ln);color:var(--ink);border-radius:8px;padding:10px;font:14px inherit}
  button{background:var(--acc);border:1px solid var(--acc);color:#241703;border-radius:8px;padding:11px 18px;cursor:pointer;font:15px inherit;font-weight:700}
  button.sec{background:var(--pan2);border-color:var(--ln);color:var(--ink);font-weight:600;padding:8px 12px;font-size:13px}
  button:disabled{opacity:.55;cursor:default}
  .quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .muted{color:var(--mut);font-size:13px}
  .stat{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;margin:4px 0 10px}
  .stat b{color:var(--ink)}
  .pill{padding:2px 10px;border-radius:20px;font-weight:700;font-size:13px}
  .pill.ok{background:rgba(79,180,119,.16);color:var(--ok)}
  .pill.err{background:rgba(217,99,90,.16);color:var(--red)}
  .pill.wait{background:rgba(217,150,42,.16);color:var(--acc)}
  pre{background:#0A0F0C;border:1px solid var(--ln);border-radius:8px;padding:14px;margin:0;white-space:pre-wrap;word-break:break-word;font:13.5px/1.55 Consolas,monospace;color:var(--ink);max-height:52vh;overflow:auto}
  .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 0 5px}
</style>
</head>
<body>
<header>
  <h1>Machine Serial Console</h1>
  <span class="muted">send a command &amp; see the raw reply</span>
  <span class="sp"></span>
  <a class="lnk" href="/machine-report.html">Report</a> &nbsp;<a class="lnk" href="/machine-inv.html">Inventory</a> &nbsp;<a class="lnk" href="/">Monitor</a>
</header>

<main>
  <div class="card">
    <div class="mtabs" id="mtabs"></div>
    <div class="quick" id="quick"></div>
    <div class="row">
      <input type="text" id="cmd" value="C1Z000" placeholder="e.g. C1Z000  |  C1M000P<name>  |  C3P" spellcheck="false"
             onkeydown="if(event.key==='Enter')send()">
      <select id="wait">
        <option value="8000">wait 8s</option>
        <option value="30000">wait 30s</option>
        <option value="65000" selected>wait 65s</option>
        <option value="120000">wait 120s</option>
      </select>
      <button id="sendbtn" onclick="send()">▶ Send</button>
    </div>
    <div class="muted" style="margin-top:8px">Read-only: only <b>C1*</b> (reports) and <b>C3*</b> (queries) are allowed. Use <b>C3P</b> to read the program name, then paste it (minus <code>.PW4</code>) into a <b>C1M000P</b> read.</div>
  </div>

  <div class="card">
    <div class="stat" id="stat"><span class="muted">No command sent yet.</span></div>
    <div class="lbl">Sent</div><pre id="sent">—</pre>
    <div class="lbl">Reply (raw)</div><pre id="reply">—</pre>
  </div>
</main>

<script>
const $=id=>document.getElementById(id);
let machine=1;
const QUICK=[
  ['C1Z per-feeder (whole machine)','C1Z000'],
  ['C1Z for THIS lot','C1Z000P__PROG__'],
  ['C1M count for THIS lot','C1M000P__PROG__'],
  ['C1M whole machine','C1M000'],
  ['C3P program name','C3P'],
];
let progName='';   // last C3P program (minus extension) for this machine

function tabs(){ const t=$('mtabs'); t.innerHTML=''; [1,2,3,4].forEach(m=>t.insertAdjacentHTML('beforeend',
  `<button class="mtab ${m===machine?'active':''}" onclick="pick(${m})">Machine ${m}</button>`)); }
function quick(){ const q=$('quick'); q.innerHTML=''; QUICK.forEach(([label,tpl])=>{
  q.insertAdjacentHTML('beforeend',`<button class="sec" onclick="setCmd('${tpl}')">${label}</button>`); }); }
function pick(m){ machine=m; progName=''; tabs(); $('stat').innerHTML='<span class="muted">Machine '+m+' — no command sent yet.</span>'; }
function setCmd(tpl){
  if(tpl.includes('__PROG__') && !progName){ $('cmd').value=tpl.replace('__PROG__',''); $('stat').innerHTML='<span class="pill wait">tip</span> send <b>C3P</b> first to fill the program name'; return; }
  $('cmd').value=tpl.replace('__PROG__',progName); $('cmd').focus();
}
function ago(iso){ if(!iso) return ''; const s=(Date.now()-new Date(iso))/1000; return s<90?Math.round(s)+'s ago':Math.round(s/60)+'m ago'; }

async function send(){
  const cmd=$('cmd').value.trim(); if(!cmd) return;
  const wait=+$('wait').value;
  const b=$('sendbtn'); b.disabled=true; const t=b.textContent; b.textContent='Sending…';
  $('stat').innerHTML='<span class="pill wait">sending</span> '+cmd+' → machine '+machine+' (waiting '+(wait/1000)+'s for reply)';
  $('sent').textContent=cmd; $('reply').textContent='…waiting for the machine…';
  try{
    const r=await fetch('/api/console/send?machine='+machine+'&waitMs='+wait+'&cmd='+encodeURIComponent(cmd),{method:'POST'});
    const d=await r.json();
    if(!r.ok){ $('stat').innerHTML='<span class="pill err">refused</span> '+(d.error||'bad request'); $('reply').textContent=d.error||''; b.disabled=false; b.textContent=t; return; }
    // capture program name from a C3P reply for the __PROG__ templates
    if(/^C3P/i.test(cmd) && d.program){ const p=d.program; const dot=p.lastIndexOf('.'); progName=dot>0?p.slice(0,dot):p; }
    const got=(d.reportLength||0)>0;
    const bad=d.error;
    $('stat').innerHTML =
      (got? '<span class="pill ok">reply '+d.reportLength+' chars</span>' : (bad? '<span class="pill err">'+bad+'</span>' : '<span class="pill err">no reply</span>'))
      + ' <span>sent <b>'+(d.sent||cmd)+'</b></span>'
      + (d.program? ' <span>program <b>'+d.program+'</b></span>':'')
      + (d.at? ' <span class="muted">'+ago(d.at)+'</span>':'')
      + (d.lastRxPayload? ' <span class="muted">last frame: '+d.lastRxPayload.slice(0,40)+'</span>':'');
    $('sent').textContent=d.sent||cmd;
    $('reply').textContent = got? d.report : (bad? ('Machine refused: '+bad+(bad==='A4E00'?'  (busy / cannot execute in current state — try on a stopped line)':'')) : 'No reply received (timed out — no D0 dump landed).');
  }catch(e){ $('stat').innerHTML='<span class="pill err">error</span> '+e; $('reply').textContent=String(e); }
  b.disabled=false; b.textContent=t;
}
tabs(); quick(); pick(1);
</script>
</body>
</html>
